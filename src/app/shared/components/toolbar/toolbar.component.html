<div class="toolbar">
  <a
    class="brand"
    routerLink="/"
    aria-label="JotJSON - back to editor"
    i18n-aria-label="@@toolbar.brand.aria"
  >
    <span class="brand-name">JotJSON</span>
  </a>

  <span class="divider" aria-hidden="true"></span>

  <button
    type="button"
    mat-icon-button
    matTooltip="Paste JSON from clipboard"
    i18n-matTooltip="@@toolbar.paste.tooltip"
    aria-label="Paste JSON from clipboard"
    i18n-aria-label="@@toolbar.paste.aria"
    (click)="pasteRequested.emit()"
  >
    <jj-icon name="paste" />
  </button>

  <button
    type="button"
    mat-icon-button
    matTooltip="Copy editor contents to clipboard (hold Alt to copy as escaped JSON string)"
    i18n-matTooltip="@@toolbar.copy.tooltip"
    aria-label="Copy editor contents to clipboard"
    i18n-aria-label="@@toolbar.copy.aria"
    [disabled]="!hasContent()"
    (click)="onCopyClick($event)"
  >
    <jj-icon name="copy" />
  </button>

  <button
    type="button"
    mat-icon-button
    matTooltip="Upload file"
    i18n-matTooltip="@@toolbar.upload.tooltip"
    aria-label="Upload file"
    i18n-aria-label="@@toolbar.upload.aria"
    (click)="triggerFilePicker()"
  >
    <jj-icon name="upload" />
  </button>
  <input
    #fileInput
    type="file"
    class="hidden-file-input"
    accept=".json,.jsonc,.jsonl,.geojson,.txt,application/json"
    (change)="onFileChange($event)"
  />

  <button
    type="button"
    mat-icon-button
    matTooltip="Download as file"
    i18n-matTooltip="@@toolbar.download.tooltip"
    aria-label="Download as file"
    i18n-aria-label="@@toolbar.download.aria"
    [disabled]="!hasContent()"
    (click)="download.emit()"
  >
    <jj-icon name="download" />
  </button>

  <span class="divider" aria-hidden="true"></span>

  <button
    type="button"
    mat-icon-button
    matTooltip="Format (pretty-print)"
    i18n-matTooltip="@@toolbar.format.tooltip"
    aria-label="Format"
    i18n-aria-label="@@toolbar.format.aria"
    [disabled]="!hasContent()"
    (click)="format.emit()"
  >
    <jj-icon name="format" />
  </button>

  <button
    type="button"
    mat-icon-button
    matTooltip="Minify"
    i18n-matTooltip="@@toolbar.minify.tooltip"
    aria-label="Minify"
    i18n-aria-label="@@toolbar.minify.aria"
    [disabled]="!hasContent()"
    (click)="minify.emit()"
  >
    <jj-icon name="minify" />
  </button>

  <button
    type="button"
    mat-icon-button
    matTooltip="Clear editor"
    i18n-matTooltip="@@toolbar.clear.tooltip"
    aria-label="Clear editor"
    i18n-aria-label="@@toolbar.clear.aria"
    [disabled]="!hasContent()"
    (click)="clear.emit()"
  >
    <jj-icon name="clear" />
  </button>

  <span class="divider" aria-hidden="true"></span>

  <mat-button-toggle-group
    class="mode-toggle"
    [value]="mode()"
    (change)="onModeChange($any($event.value))"
    aria-label="Editor mode"
    i18n-aria-label="@@toolbar.mode.aria"
  >
    <mat-button-toggle
      value="json"
      matTooltip="JSON only"
      i18n-matTooltip="@@toolbar.mode.json.tooltip"
    >
      <ng-container i18n="@@toolbar.mode.json.label">JSON</ng-container>
    </mat-button-toggle>
    <mat-button-toggle
      value="jsonc"
      matTooltip="JSON with comments"
      i18n-matTooltip="@@toolbar.mode.jsonc.tooltip"
    >
      <ng-container i18n="@@toolbar.mode.jsonc.label">JSONC</ng-container>
    </mat-button-toggle>
  </mat-button-toggle-group>

  <span class="divider" aria-hidden="true"></span>

  <input
    type="text"
    class="title-field"
    [value]="title()"
    placeholder="Title (optional)"
    i18n-placeholder="@@toolbar.title.placeholder"
    aria-label="Blob title"
    i18n-aria-label="@@toolbar.title.aria"
    maxlength="200"
    (input)="onTitleInput($event)"
    (keydown)="onTitleKeydown($event)"
  />

  <button
    type="button"
    mat-icon-button
    [matTooltip]="saveTooltip()"
    [attr.aria-label]="saveTooltip()"
    [disabled]="saveDisabled()"
    (click)="save.emit()"
  >
    <jj-icon name="save" />
  </button>

  <span class="spacer"></span>

  <button
    type="button"
    mat-icon-button
    matTooltip="Toggle layout"
    i18n-matTooltip="@@toolbar.layout.tooltip"
    aria-label="Toggle layout"
    i18n-aria-label="@@toolbar.layout.aria"
    (click)="toggleLayout.emit()"
  >
    <jj-icon [name]="layoutIcon()" />
  </button>

  <button
    type="button"
    mat-icon-button
    matTooltip="Toggle theme"
    i18n-matTooltip="@@toolbar.theme.tooltip"
    aria-label="Toggle theme"
    i18n-aria-label="@@toolbar.theme.aria"
    (click)="toggleTheme.emit()"
  >
    <jj-icon [name]="themeIcon()" />
  </button>

  @if (authConfigured) {
    <span class="divider" aria-hidden="true"></span>
    @if (isSignedIn()) {
      <a
        class="user-name"
        routerLink="/profile"
        matTooltip="View profile"
        i18n-matTooltip="@@toolbar.profile.tooltip"
        aria-label="View profile"
        i18n-aria-label="@@toolbar.profile.aria"
      >{{ user()?.displayName }}</a>
      <button
        type="button"
        mat-icon-button
        matTooltip="Sign out"
        i18n-matTooltip="@@toolbar.signOut.tooltip"
        aria-label="Sign out"
        i18n-aria-label="@@toolbar.signOut.aria"
        (click)="onSignOut()"
      >
        <jj-icon name="sign-out" />
      </button>
    } @else {
      <button
        type="button"
        mat-icon-button
        matTooltip="Sign in"
        i18n-matTooltip="@@toolbar.signIn.tooltip"
        aria-label="Sign in"
        i18n-aria-label="@@toolbar.signIn.aria"
        (click)="onSignIn()"
      >
        <jj-icon name="sign-in" />
      </button>
    }
  } @else {
    <span class="divider" aria-hidden="true"></span>
    <button
      type="button"
      mat-icon-button
      disabled
      matTooltip="Sign in (not configured)"
      i18n-matTooltip="@@toolbar.signIn.notConfigured.tooltip"
      aria-label="Sign in (not configured)"
      i18n-aria-label="@@toolbar.signIn.notConfigured.aria"
    >
      <jj-icon name="sign-in" />
    </button>
  }
</div>
