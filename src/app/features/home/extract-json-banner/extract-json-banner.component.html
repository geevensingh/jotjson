@if (visible()) {
  <mat-card
    class="banner"
    role="status"
    aria-live="polite"
    appearance="outlined"
    tabindex="-1"
    (keydown.escape)="dismiss.emit()"
  >
    <span class="banner-text">
      @if (blockCount() === 1) {
        <span i18n="@@home.paste.extract.banner.message.single"
          >Found JSON inside your paste.</span
        >
      } @else {
        <span i18n="@@home.paste.extract.banner.message.multi"
          >Found {{ blockCount() }} JSON blocks - they can be combined into an
          array.</span
        >
      }
      @if (commentsWillBeDropped()) {
        <span
          class="comment-status"
          i18n="@@home.paste.extract.banner.commentsDropped"
          >Comments will be dropped</span
        >
      }
    </span>
    <span class="banner-actions">
      @if (blockCount() === 1) {
        <button
          #extractButton
          type="button"
          mat-button
          color="primary"
          class="extract-button"
          (click)="extract.emit()"
          i18n="@@home.paste.extract.banner.actionSingle"
        >
          <jj-icon name="extract" />
          <span>Extract JSON</span>
        </button>
      } @else {
        <button
          #extractButton
          type="button"
          mat-button
          color="primary"
          class="extract-button"
          (click)="extract.emit()"
          i18n="@@home.paste.extract.banner.actionMulti"
        >
          <jj-icon name="extract" />
          <span>Extract blocks as array</span>
        </button>
      }
      <button
        type="button"
        mat-button
        (click)="dismiss.emit()"
        i18n="@@home.paste.extract.banner.dismiss"
      >
        Dismiss
      </button>
    </span>
  </mat-card>
}
