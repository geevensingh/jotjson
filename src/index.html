<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JotJSON - JSON viewer, formatter, and tree explorer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A fast JSON and JSONC viewer. Paste raw JSON to format, search, and browse it as a tree - anonymously, or signed in for history and shareable links."
    />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="canonical" href="https://jotjson.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JotJSON" />
    <meta property="og:title" content="JotJSON - JSON viewer, formatter, and tree explorer" />
    <meta
      property="og:description"
      content="A fast JSON and JSONC viewer. Paste raw JSON to format, search, and browse it as a tree - anonymously, or signed in for history and shareable links."
    />
    <meta property="og:url" content="https://jotjson.com/" />
    <meta property="og:image" content="https://jotjson.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JotJSON - JSON viewer, formatter, and tree explorer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JotJSON" />
    <meta
      name="twitter:description"
      content="A fast JSON and JSONC viewer. Paste raw JSON to format, search, and browse it as a tree."
    />
    <meta name="twitter:image" content="https://jotjson.com/og.png" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /*
       * Pre-bootstrap splash. Renders as a sibling of <app-root> (NOT
       * inside it) so the static-prerender pipeline -- which replaces
       * <app-root>'s children with the SSR-rendered Angular tree --
       * does not strip the splash markup from the served HTML. Without
       * this placement, prerendered routes (/ and /404) would briefly
       * show their server-skeleton (e.g. the home brand + tagline)
       * before Angular bootstrapped on top. AppComponent removes the
       * #jot-static-splash element after its first paint via
       * afterNextRender + double-rAF, so the Angular splash (visually
       * identical, painted on top because it is later in DOM order)
       * takes over without a flash gap.
       *
       * Theme tokens mirror src/styles/_variables.scss (color-primary
       * #00bcd4, bg dark #1e1e1e / light #fafafa). The bar height
       * (8px) and top:0 position match the in-app route progress bar
       * so the handoff at first NavigationEnd is visually continuous.
       *
       * This static splash always shows the generic "Loading JotJSON..."
       * label; the Angular splash component takes over once mounted and
       * cycles through "Loading JotJSON..." -> "Downloading JSON..." ->
       * "Rendering tree..." per the lifecycle stages in
       * LoadingSplashService.
       *
       * Strings here are intentionally outside Angular's i18n pipeline -
       * see AGENTS.md "Internationalization" section.
       */
      .jot-splash {
        --jot-bg: #1e1e1e;
        --jot-fg: #e4e4e4;
        --jot-fg-dim: #a0a0a0;
        --jot-primary: #00bcd4;
        --jot-track: rgba(0, 188, 212, 0.18);
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: var(--jot-bg);
        color: var(--jot-fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        z-index: 1;
      }
      @media (prefers-color-scheme: light) {
        .jot-splash {
          --jot-bg: #fafafa;
          --jot-fg: #1a1a1a;
          --jot-fg-dim: #5a5a5a;
          --jot-track: rgba(0, 188, 212, 0.22);
        }
      }
      .jot-splash__bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 8px;
        background: var(--jot-track);
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0, 188, 212, 0.6);
        pointer-events: none;
      }
      .jot-splash__bar::before,
      .jot-splash__bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        background: var(--jot-primary);
        will-change: left, right;
      }
      .jot-splash__bar::before {
        animation: jot-indeterminate-1 2s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
      }
      .jot-splash__bar::after {
        animation: jot-indeterminate-2 2s cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
        animation-delay: 1.15s;
      }
      @keyframes jot-indeterminate-1 {
        0% {
          left: -35%;
          right: 100%;
        }
        60% {
          left: 100%;
          right: -90%;
        }
        100% {
          left: 100%;
          right: -90%;
        }
      }
      @keyframes jot-indeterminate-2 {
        0% {
          left: -200%;
          right: 100%;
        }
        60% {
          left: 107%;
          right: -8%;
        }
        100% {
          left: 107%;
          right: -8%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .jot-splash__bar::before {
          animation: jot-pulse 1.4s ease-in-out infinite;
          left: 0;
          right: 0;
        }
        .jot-splash__bar::after {
          display: none;
        }
      }
      @keyframes jot-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      /*
       * Determinate variant: the resolver streams progress fractions
       * into LoadingSplashService, which the LoadingSplashComponent
       * binds via [style.--jot-progress] (range [0..1]). The bar uses
       * a single ::before fill at 100% width, scaled horizontally
       * from the left. The 200ms ease-out transition smooths the
       * jumps between progress events; under prefers-reduced-motion
       * we drop the transition so updates snap (no positional motion,
       * no animation cues).
       *
       * The static splash inside <app-root> never enters this state -
       * by definition we have no progress signal before Angular boots.
       * Only the Angular splash component (post-bootstrap) toggles
       * `.jot-splash__bar--determinate`.
       */
      .jot-splash__bar--determinate {
        --jot-progress: 0;
      }
      .jot-splash__bar--determinate::before {
        animation: none;
        left: 0;
        right: 0;
        transform-origin: left center;
        transform: scaleX(var(--jot-progress, 0));
        transition: transform 200ms ease-out;
        will-change: transform;
      }
      .jot-splash__bar--determinate::after {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .jot-splash__bar--determinate::before {
          animation: none;
          transition: none;
          opacity: 1;
        }
      }
      .jot-splash__logo {
        width: 96px;
        height: 96px;
        display: block;
      }
      .jot-splash__label {
        font-size: 15px;
        letter-spacing: 0.02em;
        color: var(--jot-fg-dim);
        margin: 0;
      }
    </style>
  </head>
  <body class="theme-system">
    <div id="jot-static-splash" class="jot-splash" role="status" aria-live="polite">
      <div class="jot-splash__bar" aria-hidden="true"></div>
      <svg
        class="jot-splash__logo"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 512 512"
        aria-hidden="true"
      >
        <rect width="512" height="512" rx="96" ry="96" fill="#1e1e1e" />
        <g
          fill="none"
          stroke="#00bcd4"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M168 112 C 132 112, 120 132, 120 164 L 120 228 C 120 248, 108 256, 88 256 C 108 256, 120 264, 120 284 L 120 348 C 120 380, 132 400, 168 400"
          />
          <path
            d="M344 112 C 380 112, 392 132, 392 164 L 392 228 C 392 248, 404 256, 424 256 C 404 256, 392 264, 392 284 L 392 348 C 392 380, 380 400, 344 400"
          />
        </g>
        <path
          d="M296 144 L 296 316 C 296 360, 268 384, 232 384 C 200 384, 176 364, 168 336"
          fill="none"
          stroke="#00bcd4"
          stroke-width="44"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <p class="jot-splash__label">Loading JotJSON...</p>
    </div>
    <app-root></app-root>
  </body>
</html>
