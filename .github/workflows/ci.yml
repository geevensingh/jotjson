name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web build & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Materialize environment.ts
        run: cp src/environments/environment.example.ts src/environments/environment.ts
      - run: npm run lint
      - run: npm run build -- --configuration=production

  api:
    name: API build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Run tests
        run: npm test
      - name: Upload api JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-junit
          path: api/test-results/api/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish api test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: API test results
          path: api/test-results/api/junit.xml
          reporter: java-junit
          fail-on-error: false

  workflows-lint:
    name: Workflows lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -color

  web-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Materialize environment.ts
        run: cp src/environments/environment.example.ts src/environments/environment.ts
      - run: npm run test:ci
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: coverage/jotjson
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload web JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-junit
          path: test-results/web/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish web test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Web test results
          path: test-results/web/junit.xml
          reporter: java-junit
          fail-on-error: false

