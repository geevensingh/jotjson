name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-level permissions are the absolute minimum every job
# needs:
#   - contents: read   -- actions/checkout@v6 (every job)
#
# Per-job escalations live in each job's `permissions:` block:
#   - web             -> id-token: write (azure/login@v3 for sourcemap upload)
#   - api             -> checks: write (dorny/test-reporter@v3)
#   - api-integration -> checks: write (dorny/test-reporter@v3)
#   - web-tests       -> checks: write (dorny/test-reporter@v3)
#   - smoke-e2e       -> checks: write (dorny/test-reporter@v3)
#   - workflows-lint  -> no escalation (actionlint only)
#
# Notable previous over-grants tightened:
#   - id-token: write was workflow-level (giving every job an OIDC
#     token they never used). Now scoped to the `web` job only, the
#     only job that calls out to Azure.
#   - checks: write was workflow-level (giving workflows-lint and
#     other non-publishing jobs the right to mutate check runs they
#     never create). Now scoped to the four dorny/test-reporter@v3
#     callers only.
#   - pull-requests: write was workflow-level but no step actually
#     posts PR comments. dorny/test-reporter@v3 reports via check
#     runs, not PR comments. Removed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web build & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The web job calls azure/login@v3 (federated OIDC) for the
    # sourcemap upload step. id-token: write is granted only here so
    # other CI jobs cannot exchange a token for Azure access if a
    # third-party action they invoke is compromised. The web job does
    # not publish check runs (no dorny/test-reporter usage), so
    # checks: write is intentionally omitted.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `git rev-list --count HEAD` in
          # scripts/write-build-info.mjs returns a real build counter.
          # Other CI jobs (api, lint, infra) don't ship the artifact and
          # can run shallow without harm; only this job's npm run build
          # bakes BUILD_INFO into the production bundle.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install api/ dependencies (cross-workspace knip)
        # The web job's npm ci installs only the root workspace. knip runs
        # from the root and analyzes both root + api/ per knip.jsonc, so it
        # needs api/node_modules present to resolve binaries that
        # api/devDependencies provides (e.g. `jest` referenced by api's
        # `"test": "jest"` script). Installing api/ at the top of the job
        # mirrors the local `lint:all` flow and keeps install-vs-lint
        # failure attribution unambiguous in the Actions UI: an npm ci
        # failure here is clearly an "install" failure, not a "knip
        # finding" failure misattributed to `lint-unused`.
        run: npm --prefix api ci
      - name: Materialize environment.ts
        run: cp src/environments/environment.example.ts src/environments/environment.ts
      - name: Generate build-info.ts
        # Replaces the prelint side effect that the compound `npm run lint`
        # used to provide. The split per-gate scripts below do not have a
        # prelint hook, so we materialize src/generated/build-info.ts here
        # (it is imported by the production bundle).
        run: npm run build:info
      - name: Lint - TypeScript
        id: lint-tsc
        run: |
          echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/tsc.json"
          npm run lint:tsc
          echo "::remove-matcher owner=tsc-jotjson::"
      - name: Lint - TypeScript (specs)
        id: lint-tsc-spec
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: |
          echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/tsc.json"
          npm run lint:tsc-spec
          echo "::remove-matcher owner=tsc-jotjson::"
      - name: Lint - TypeScript (perf L2)
        id: lint-tsc-perf-l2
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: |
          echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/tsc.json"
          npm run lint:tsc-perf-l2
          echo "::remove-matcher owner=tsc-jotjson::"
      - name: Lint - ASCII allowlist
        id: lint-ascii
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run lint:ascii
      - name: Lint - Spec patterns
        id: lint-spec-patterns
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run lint:spec-patterns
      - name: Lint - Production patterns
        id: lint-prod-patterns
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run lint:prod-patterns
      - name: Lint - CSP hashes (source)
        id: lint-csp-hashes
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run lint:csp-hashes
      - name: Lint - SWA config
        id: lint-swa-config
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run lint:swa-config
      - name: Lint - deploy freshness CLI
        # Issue #336 -- parses .github/workflows/cd.yml and cd-nonprod.yml
        # and replays every `npm run check:deploy-freshness` argv through
        # parseCliOptions to catch workflow-vs-script CLI drift at PR
        # review time. Also rejects empty-string runtime substitution
        # (e.g. `--expected-sha=${{ vars.MISSING }}`).
        id: lint-deploy-freshness-cli
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run lint:deploy-freshness-cli
      - name: Lint - SW shape
        # Asserts (1) the source SHA-256 of src/sw.worker.ts matches the
        # value committed in scripts/check-sw-shape.mjs (mechanical
        # forcing function: every edit to the SW source must be paired
        # with a hash update visible in review), and (2) post-build
        # byte-identity of dist/jotjson/browser/sw.js vs every legacy
        # alias plus the inert ngsw.json stub. The build-output
        # assertions only fire when dist/ exists, so this step is safe
        # to run pre-build.
        id: lint-sw-shape
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run lint:sw-shape
      - name: Lint - Unused code
        # knip-driven detection of orphan npm deps, unused exports/types,
        # and unused files across the root SPA + api/ workspaces. All
        # knip rule classes (deps + exports + types + ns* + files +
        # enumMembers + duplicates) run at `error` -- no rule is silently
        # disabled. Allowlist additions (ignoreDependencies,
        # ignoreBinaries, or workspace `entry` patterns) require a
        # rationale comment naming the specific mechanism by which the
        # dep/entry is used. The api/ workspace is `npm ci`d at the top
        # of this job so knip can resolve cross-workspace binaries.
        id: lint-unused
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run lint:unused
      - name: Lint - Prettier formatting
        id: lint-format
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run lint:format
      - name: Script tests
        # Unit tests for scripts/*.mjs (currently: scripts/check-csp-hashes.mjs,
        # scripts/check-swa-config.mjs).
        # Uses Node's built-in test runner (no extra deps). Runs in the web
        # job because that is where lint:csp-hashes lives; keeps the
        # scripts/ scope under one job.
        id: test-scripts
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run test:scripts
      - name: Perf script tests
        # Determinism tests for perf/fixtures/**/*.test.mjs. Separate from
        # test:scripts because the determinism test imports a tsc-built
        # artifact (dist-perf/perf/fixtures/generate.js) and auto-runs
        # `npm run perf:build` (~20s) when dist-perf is missing. Keeping
        # this out of test:scripts prevents that build from coupling into
        # `verify:fast`. The cross-machine determinism check is precisely
        # what CI is for, so it runs here as its own gate.
        id: test-perf-scripts
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        run: npm run test:perf-scripts
      - name: Lint summary
        # Inspects each gate's outcome and writes a single
        # $GITHUB_STEP_SUMMARY block listing every failing gate and its
        # fix command. Per-gate `if: failure()` would not work here
        # because failure() is job-wide and would fire for every later
        # gate once any earlier gate failed.
        #
        # Covers every lint gate above plus the Script tests and Perf
        # script tests phases. When a new gate is added, append its
        # outcome to the env block below and its emit row to the run
        # script. The trailing "All N gates passed" line still uses a
        # hand-maintained literal pending issue #429 (replace with a
        # derived count) -- bump the literal too.
        if: ${{ !cancelled() && steps.lint-tsc.conclusion != 'skipped' }}
        env:
          OUTCOME_TSC: ${{ steps.lint-tsc.outcome }}
          OUTCOME_TSC_SPEC: ${{ steps.lint-tsc-spec.outcome }}
          OUTCOME_TSC_PERF_L2: ${{ steps.lint-tsc-perf-l2.outcome }}
          OUTCOME_ASCII: ${{ steps.lint-ascii.outcome }}
          OUTCOME_SPEC: ${{ steps.lint-spec-patterns.outcome }}
          OUTCOME_PROD: ${{ steps.lint-prod-patterns.outcome }}
          OUTCOME_CSP: ${{ steps.lint-csp-hashes.outcome }}
          OUTCOME_SWA_CONFIG: ${{ steps.lint-swa-config.outcome }}
          OUTCOME_FRESHNESS_CLI: ${{ steps.lint-deploy-freshness-cli.outcome }}
          OUTCOME_SW_SHAPE: ${{ steps.lint-sw-shape.outcome }}
          OUTCOME_UNUSED: ${{ steps.lint-unused.outcome }}
          OUTCOME_FORMAT: ${{ steps.lint-format.outcome }}
          OUTCOME_TEST_SCRIPTS: ${{ steps.test-scripts.outcome }}
          OUTCOME_TEST_PERF_SCRIPTS: ${{ steps.test-perf-scripts.outcome }}
        run: |
          fail=0
          {
            echo "## Lint and script-test results"
            echo ""
            emit() {
              local label="$1"
              local outcome="$2"
              local fix="$3"
              if [ "$outcome" = "success" ]; then
                echo "- :white_check_mark: ${label}"
              elif [ "$outcome" = "failure" ]; then
                fail=1
                echo "- :x: **${label}** - fix: \`${fix}\`"
              else
                echo "- :grey_question: ${label} (${outcome})"
              fi
            }
            emit "TypeScript (tsc)"        "$OUTCOME_TSC"          "fix the type error reported above"
            emit "TypeScript specs (tsc)"  "$OUTCOME_TSC_SPEC"     "fix the type error reported above"
            emit "TypeScript perf L2 (tsc)" "$OUTCOME_TSC_PERF_L2" "fix the type error reported above (tsconfig.perf-l2.json)"
            emit "ASCII allowlist"         "$OUTCOME_ASCII"        "edit ALLOWED in scripts/check-ascii.mjs or remove the codepoint"
            emit "Spec patterns"           "$OUTCOME_SPEC"         "see scripts/check-spec-patterns.mjs for the rule and approved alternative"
            emit "Production patterns"     "$OUTCOME_PROD"         "see scripts/check-prod-patterns.mjs for the rule and approved alternative"
            emit "CSP hashes (source)"     "$OUTCOME_CSP"          "npm run lint:csp-hashes - paste the printed hash into script-src in staticwebapp.config.json"
            emit "SWA config"              "$OUTCOME_SWA_CONFIG"   "npm run lint:swa-config - fix the assertion failure printed above; see scripts/check-swa-config.mjs"
            emit "Deploy freshness CLI"    "$OUTCOME_FRESHNESS_CLI" "npm run lint:deploy-freshness-cli - workflow argv must match scripts/check-deploy-freshness.mjs CLI; see error printed above"
            emit "SW shape"                "$OUTCOME_SW_SHAPE"     "npm run lint:sw-shape - if src/sw.worker.ts changed intentionally, update EXPECTED_SW_SOURCE_SHA256 in scripts/check-sw-shape.mjs"
            emit "Unused code"             "$OUTCOME_UNUSED"       "npm run lint:unused - either remove the unused export/dep/file, add a workspace 'entry' pattern (for files reachable only via a runtime convention knip can't see, e.g. Playwright's testDir), or add the dep to knip.jsonc ignoreDependencies (or ignoreBinaries, for CLI tools invoked from scripts); every allowlist addition needs a rationale comment naming the specific (not generic) mechanism by which the dep/entry is used"
            emit "Prettier formatting"     "$OUTCOME_FORMAT"       "npm run format"
            emit "Script tests"            "$OUTCOME_TEST_SCRIPTS" "npm run test:scripts - then fix the failing assertion in scripts/*.test.mjs"
            emit "Perf script tests"       "$OUTCOME_TEST_PERF_SCRIPTS" "npm run test:perf-scripts - then fix the failing assertion in perf/fixtures/*.test.mjs"
            echo ""
            if [ "$fail" -eq 1 ]; then
              echo "One or more gates failed. See the failing step above and the inline annotations on the PR Files Changed tab for details."
            else
              echo "All 13 gates passed (11 lint + script tests + perf script tests)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Bake production auth config into environment.prod.ts
        # Only bake real secrets on push-to-main. PRs build against the
        # placeholder environment.prod.ts checked into the repo (gate-only
        # build). The baked file is consumed by the next step's
        # production build and uploaded as the web-dist artifact for cd.yml
        # to deploy.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ENTRA_SPA_CLIENT_ID: ${{ secrets.ENTRA_SPA_CLIENT_ID }}
          ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
          ENTRA_KNOWN_AUTHORITY: ${{ secrets.ENTRA_KNOWN_AUTHORITY }}
          ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
          APP_INSIGHTS_CONNECTION_STRING: ${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}
        run: |
          # SWA-hosted site is reachable at both the SWA default hostname and
          # the custom domain (jotjson.com) once bound. MSAL only allows one
          # redirectUri in its config, so we pick the canonical custom domain.
          cat > src/environments/environment.prod.ts <<'EOF'
          import { Environment } from './environment.interface';

          export const environment: Environment = {
            production: true,
            apiBaseUrl: '/api',
            auth: {
              clientId: '__ENTRA_SPA_CLIENT_ID__',
              authority: '__ENTRA_AUTHORITY__',
              knownAuthorities: ['__ENTRA_KNOWN_AUTHORITY__'],
              redirectUri: 'https://jotjson.com/',
              postLogoutRedirectUri: 'https://jotjson.com/',
              scopes: ['__ENTRA_API_SCOPE__']
            },
            appInsightsConnectionString: '__APP_INSIGHTS_CONNECTION_STRING__'
          };
          EOF
          # Strip the 10-space leading indent the heredoc inherits from
          # the YAML so the emitted TS reads naturally.
          sed -i 's/^          //' src/environments/environment.prod.ts
          # Substitute secrets. App Insights is intentionally optional - an
          # empty connection string disables telemetry for that build.
          sed -i "s|__ENTRA_SPA_CLIENT_ID__|${ENTRA_SPA_CLIENT_ID}|g" src/environments/environment.prod.ts
          sed -i "s|__ENTRA_AUTHORITY__|${ENTRA_AUTHORITY}|g" src/environments/environment.prod.ts
          sed -i "s|__ENTRA_KNOWN_AUTHORITY__|${ENTRA_KNOWN_AUTHORITY}|g" src/environments/environment.prod.ts
          sed -i "s|__ENTRA_API_SCOPE__|${ENTRA_API_SCOPE}|g" src/environments/environment.prod.ts
          # `|` delimiter for AI because the connection string contains `=`
          # but no `|`.
          sed -i "s|__APP_INSIGHTS_CONNECTION_STRING__|${APP_INSIGHTS_CONNECTION_STRING}|g" src/environments/environment.prod.ts
          if grep -q "__ENTRA_" src/environments/environment.prod.ts; then
            echo "::error::One or more ENTRA_* secrets are missing - aborting build."
            exit 1
          fi
      - env:
          # workflow_run.head_sha is unset for push triggers; github.sha
          # is the push commit. Pins BUILD_INFO.sha so the deployed
          # bundle's encoded SHA matches what the freshness gate later
          # asserts. See cd.yml for the workflow_run/dispatch case.
          JOTJSON_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npm run build -- --configuration=production
      - name: CSP - verify hashes against built bundle
        # Authoritative CSP hash gate. `npm run lint:csp-hashes` only sees
        # the source index.html; this re-runs against the bytes that will
        # actually be served (Angular's prod builder + Beasties may mutate
        # the inline script). Runs on every web build (push and PR) so the
        # gate catches build-time mutations even on PRs.
        run: node scripts/check-csp-hashes.mjs --dist
      - name: CSP - verify origins against baked secrets
        # Catches drift where ENTRA_AUTHORITY or
        # APP_INSIGHTS_CONNECTION_STRING moves to a host that the CSP
        # allowlist no longer covers. Only runs on push-to-main because
        # the secrets are only injected then.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
          APP_INSIGHTS_CONNECTION_STRING: ${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}
        run: node scripts/check-csp-hashes.mjs --ci-origins
      - name: Verify build counter populated
        # The production bundle ships BUILD_INFO baked in by
        # scripts/write-build-info.mjs (a `pre*` hook on every npm
        # script). If checkout was shallow, the script falls back to
        # `buildNumber: "unknown"` rather than emitting a misleading
        # counter. Fail the workflow loudly so the missing fetch-depth
        # is fixed before a "build unknown" artifact ships to prod.
        run: |
          if grep -q '"buildNumber": "unknown"' src/generated/build-info.ts; then
            echo "::error::buildNumber resolved to 'unknown' in the shipped artifact - the web job's checkout needs fetch-depth: 0 (full git history)."
            exit 1
          fi
      - name: Copy SWA config into bundle
        # staticwebapp.config.json lives at repo root because that's where
        # the SWA CLI looks for it during local dev. The SWA deploy action
        # with skip_app_build: true reads the config from app_location,
        # which is the bundle directory - so we copy it in here.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp staticwebapp.config.json dist/jotjson/browser/staticwebapp.config.json
      - name: Sanity-check production bundle
        # Only meaningful when the bake step ran (push-to-main). On PRs the
        # bundle still contains placeholder __ENTRA_* literals by design.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -f dist/jotjson/browser/index.html ]; then
            echo "::error::dist/jotjson/browser/index.html missing"
            exit 1
          fi
          if [ ! -f dist/jotjson/browser/staticwebapp.config.json ]; then
            echo "::error::dist/jotjson/browser/staticwebapp.config.json missing"
            exit 1
          fi
          if grep -r --include='*.js' '__ENTRA_' dist/jotjson/browser/; then
            echo "::error::Production bundle contains __ENTRA_ placeholder - secret bake failed"
            exit 1
          fi
      - name: Upload web bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/jotjson
          if-no-files-found: error
          retention-days: 30
      # ------------------------------------------------------------------
      # Sourcemap upload to Azure Blob Storage for App Insights
      # symbolication. Runs AFTER the artifact upload so a transient
      # storage hiccup doesn't block CD's input artifact (artifact
      # already preserved); but we DO fail loudly so CD's
      # workflow_run-on-success trigger doesn't fire and ship a deploy
      # whose AI traces silently lack symbolication. The maps remain
      # in the web-dist artifact and are deployed to SWA unchanged -
      # this step only mirrors them into the AI-connected Storage
      # container so the portal can de-symbolicate exception details.
      # See DESIGN_SPEC.md "Sourcemaps" section.
      # ------------------------------------------------------------------
      - name: Azure login (sourcemap upload)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload sourcemaps to Azure Blob Storage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: |
          az storage blob upload-batch \
            --source dist/jotjson/browser \
            --destination sourcemaps \
            --account-name "$STORAGE_ACCOUNT" \
            --pattern '*.map' \
            --auth-mode login \
            --overwrite true
      - name: Azure logout (sourcemap upload)
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: az logout --username "${{ secrets.AZURE_CLIENT_ID }}" || true

  api:
    name: API build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishes test results via dorny/test-reporter@v3.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Lint (tsc --noEmit)
        run: |
          echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/tsc.json"
          npx tsc --pretty false --noEmit
          echo "::remove-matcher owner=tsc-jotjson::"
      - name: Run tests
        id: run-api-tests
        run: npm test
      - name: Mergify CI Upload (api unit)
        if: steps.run-api-tests.outcome == 'success' || steps.run-api-tests.outcome == 'failure'
        continue-on-error: true
        uses: mergifyio/gha-mergify-ci@v20
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: api/test-results/api/junit.xml
          test_step_outcome: ${{ steps.run-api-tests.outcome }}
      - name: Mergify CI Upload - failure notice (api unit)
        if: failure() && steps.run-api-tests.outcome != 'skipped'
        run: |
          echo "::warning::Mergify CI upload may have failed for api unit. Check MERGIFY_TOKEN secret and dashboard."
          echo "Mergify CI upload may have failed for api unit. Check MERGIFY_TOKEN secret and dashboard." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload api JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-junit
          path: api/test-results/api/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish api test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: API test results
          path: api/test-results/api/junit.xml
          reporter: java-junit
          fail-on-error: false
          # Override dorny defaults (list-suites: all, list-tests: all)
          # so the Step Summary on the run page shows only failing
          # suites + tests instead of a wall of every passing test. A
          # 1-in-N failure was invisibly buried in ~3300 lines of green
          # check marks before this override (see run 26011840111).
          list-suites: failed
          list-tests: failed
      # ------------------------------------------------------------------
      # Build the API and upload it as the api-dist artifact for cd.yml's
      # workflow_run path. With cd.yml passing skip_api_build: true to the
      # SWA action, Oryx is bypassed entirely; the deploy is just an
      # upload of the prebuilt tree. This eliminates the Oryx SDK-detect
      # flake (CDN XPath null-node) that periodically fails CD. Gated on
      # push-to-main only, mirroring the web-dist gate.
      # ------------------------------------------------------------------
      - name: Build API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build
      - name: Upload api bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: api-dist
          # Pack only the files SWA Functions needs at runtime: host.json,
          # package manifest + lockfile (so cd.yml can `npm ci` prod deps),
          # and the compiled JS under dist/. Omits node_modules (cd.yml
          # reinstalls), source TypeScript, tests, and tsconfig.
          path: |
            api/host.json
            api/package.json
            api/package-lock.json
            api/dist
          if-no-files-found: error
          retention-days: 30

  api-integration:
    name: Smoke api integration (real Cosmos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishes test results via dorny/test-reporter@v3.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Cosmos secret preflight
        id: cosmos-preflight
        # GitHub Actions does not support `secrets.* != ''` in `if:`
        # conditions on jobs/steps. Instead we read the secrets into
        # env (which DOES work) and write a non-secret enabled flag.
        # Partial config (one secret set, the other not) fails loud.
        env:
          COSMOS_CI_ENDPOINT: ${{ secrets.COSMOS_CI_ENDPOINT }}
          COSMOS_CI_KEY: ${{ secrets.COSMOS_CI_KEY }}
        run: |
          if [ -z "$COSMOS_CI_ENDPOINT" ] && [ -z "$COSMOS_CI_KEY" ]; then
            echo "Both COSMOS_CI_* secrets unset - skipping integration tests."
            echo "See docs/ci-cosmos.md for provisioning instructions."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$COSMOS_CI_ENDPOINT" ] || [ -z "$COSMOS_CI_KEY" ]; then
            echo "::error::Partial Cosmos CI secret config (one of {COSMOS_CI_ENDPOINT, COSMOS_CI_KEY} unset). Configure both or neither."
            exit 1
          else
            echo "Cosmos CI secrets present; integration job active."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run integration tests
        id: run-api-integration
        if: steps.cosmos-preflight.outputs.enabled == 'true'
        env:
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_CI_ENDPOINT }}
          COSMOS_KEY: ${{ secrets.COSMOS_CI_KEY }}
          COSMOS_DATABASE: jotjson-ci
          # run_id + run_attempt avoids stale-state collisions on
          # workflow rerun (run_id is reused; run_attempt increments).
          COSMOS_BLOBS_CONTAINER: blobs-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:integration
      - name: Mergify CI Upload (api integration)
        if: (steps.run-api-integration.outcome == 'success' || steps.run-api-integration.outcome == 'failure') && steps.cosmos-preflight.outputs.enabled == 'true'
        continue-on-error: true
        uses: mergifyio/gha-mergify-ci@v20
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: api/test-results/api-integration/junit.xml
          test_step_outcome: ${{ steps.run-api-integration.outcome }}
      - name: Mergify CI Upload - failure notice (api integration)
        if: failure() && steps.run-api-integration.outcome != 'skipped' && steps.cosmos-preflight.outputs.enabled == 'true'
        run: |
          echo "::warning::Mergify CI upload may have failed for api integration. Check MERGIFY_TOKEN secret and dashboard."
          echo "Mergify CI upload may have failed for api integration. Check MERGIFY_TOKEN secret and dashboard." >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup integration container (backstop)
        # `if: always()` covers Jest hard-crashes that bypass
        # globalTeardown. Setup-time orphan cleanup at the next run
        # covers runner cancellation that bypasses both layers.
        if: always() && steps.cosmos-preflight.outputs.enabled == 'true'
        env:
          COSMOS_CI_ENDPOINT: ${{ secrets.COSMOS_CI_ENDPOINT }}
          COSMOS_CI_KEY: ${{ secrets.COSMOS_CI_KEY }}
          COSMOS_DATABASE: jotjson-ci
          CONTAINER_TO_DROP: blobs-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node -e "
          const { CosmosClient } = require('@azure/cosmos');
          const client = new CosmosClient({
            endpoint: process.env.COSMOS_CI_ENDPOINT,
            key: process.env.COSMOS_CI_KEY,
          });
          (async () => {
            try {
              await client
                .database(process.env.COSMOS_DATABASE)
                .container(process.env.CONTAINER_TO_DROP)
                .delete();
              console.log('Backstop cleanup: dropped ' + process.env.CONTAINER_TO_DROP);
            } catch (error) {
              console.warn('Backstop cleanup: ' + (error.message || error));
            }
          })();
          "
      - name: Upload api integration JUnit
        if: always() && steps.cosmos-preflight.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-junit
          path: api/test-results/api-integration/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish api integration test results
        if: always() && steps.cosmos-preflight.outputs.enabled == 'true'
        uses: dorny/test-reporter@v3
        with:
          name: API integration test results
          path: api/test-results/api-integration/junit.xml
          reporter: java-junit
          fail-on-error: false
          # See rationale on the api test-results step above.
          list-suites: failed
          list-tests: failed

  workflows-lint:
    name: Workflows lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # Pinned per #69. Both the install script URL and the binary
      # version resolve to the v1.7.12 release tag (not `main` or
      # "latest") so CI runs are reproducible against accidental
      # upstream drift. This does NOT defend against a maliciously
      # force-moved tag or a swapped release asset; that residual
      # risk is tracked in #182 (Option C, sha256-verified binary).
      #
      # To refresh: bump ACTIONLINT_VERSION below to the new release
      # (digits only, no `v` prefix). Dependabot does not track raw
      # curl URLs in `run:` steps.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          if [[ ! "${ACTIONLINT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ACTIONLINT_VERSION must be X.Y.Z (digits only, no 'v' prefix), got '${ACTIONLINT_VERSION}'" >&2
            exit 1
          fi
          script="$(mktemp)"
          trap 'rm -f "${script}"' EXIT
          curl -fsSL \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            -o "${script}"
          install_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "${install_dir}"
          bash "${script}" "${ACTIONLINT_VERSION}" "${install_dir}"
          if ! [ -x "${install_dir}/actionlint" ]; then
            echo "actionlint not installed at ${install_dir}/actionlint" >&2
            exit 1
          fi
          echo "${install_dir}" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -color

  web-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Publishes test results via dorny/test-reporter@v3.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright-chromium
      - name: Materialize environment.ts
        run: cp src/environments/environment.example.ts src/environments/environment.ts
      - name: Run tests with coverage
        id: run-web-tests
        run: npm run test:ci
      - name: Mergify CI Upload (web unit)
        if: steps.run-web-tests.outcome == 'success' || steps.run-web-tests.outcome == 'failure'
        continue-on-error: true
        uses: mergifyio/gha-mergify-ci@v20
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: test-results/web/junit.xml
          test_step_outcome: ${{ steps.run-web-tests.outcome }}
      - name: Mergify CI Upload - failure notice (web unit)
        if: failure() && steps.run-web-tests.outcome != 'skipped'
        run: |
          echo "::warning::Mergify CI upload may have failed for web unit. Check MERGIFY_TOKEN secret and dashboard."
          echo "Mergify CI upload may have failed for web unit. Check MERGIFY_TOKEN secret and dashboard." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: coverage/jotjson
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload web JUnit
        # Guard on hashFiles so a Vitest worker crash that fails to
        # write JUnit at all doesn't mask the real failure with a
        # noisy "no JUnit file found" error from the upload action
        # (issue #47, Skeptic #13).
        if: always() && hashFiles('test-results/web/junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: web-junit
          path: test-results/web/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish web test results
        if: always() && hashFiles('test-results/web/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Web test results
          path: test-results/web/junit.xml
          reporter: java-junit
          fail-on-error: false
          # See rationale on the api test-results step above.
          list-suites: failed
          list-tests: failed

  e2e:
    name: Smoke e2e (anonymous, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishes test results via dorny/test-reporter@v3.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Materialize environment.ts
        # Anonymous bundle: uses the example environment (no real MSAL secrets).
        # Mirrors the pattern in the `web-tests` job.
        run: cp src/environments/environment.example.ts src/environments/environment.ts
      - name: Generate build-info.ts
        run: npm run build:info
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright-chromium
      - name: Run smoke e2e
        id: run-e2e-tests
        run: npm run test:e2e
      - name: Mergify CI Upload (e2e)
        if: steps.run-e2e-tests.outcome == 'success' || steps.run-e2e-tests.outcome == 'failure'
        continue-on-error: true
        uses: mergifyio/gha-mergify-ci@v20
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: test-results/e2e/junit.xml
          test_step_outcome: ${{ steps.run-e2e-tests.outcome }}
      - name: Mergify CI Upload - failure notice (e2e)
        if: failure() && steps.run-e2e-tests.outcome != 'skipped'
        run: |
          echo "::warning::Mergify CI upload may have failed for e2e. Check MERGIFY_TOKEN secret and dashboard."
          echo "Mergify CI upload may have failed for e2e. Check MERGIFY_TOKEN secret and dashboard." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload e2e JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-junit
          path: test-results/e2e/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish e2e test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Smoke e2e results
          path: test-results/e2e/junit.xml
          reporter: java-junit
          fail-on-error: false
          # See rationale on the api test-results step above.
          list-suites: failed
          list-tests: failed

