name: Deploy (SWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swa-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build and deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy token
        id: check
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN not set — skipping deploy."
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.have_token == 'true'
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v6
        if: steps.check.outputs.have_token == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install web deps
        if: steps.check.outputs.have_token == 'true'
        run: npm ci

      - name: Install API deps
        if: steps.check.outputs.have_token == 'true'
        working-directory: api
        run: npm ci

      - name: Deploy to Azure Static Web Apps
        if: steps.check.outputs.have_token == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          api_location: 'api'
          output_location: 'dist/jotjson/browser'
