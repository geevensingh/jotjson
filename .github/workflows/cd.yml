name: Deploy (SWA)

# ----------------------------------------------------------------------
# Build topology (READ BEFORE EDITING)
#
# This workflow has TWO build paths, gated on the trigger:
#
# 1. workflow_run (auto-deploy after CI on push-to-main)
#    The web bundle is BUILT IN CI's `web` job (with real secrets baked
#    into environment.prod.ts) and uploaded as the `web-dist` artifact.
#    `staticwebapp.config.json` is copied into the bundle by CI before
#    upload so the artifact is self-contained. This job downloads the
#    artifact into `dist/jotjson` and passes `skip_app_build: true` to
#    the SWA action; with that flag the action treats `app_location`
#    as the prebuilt output directory (per Microsoft docs) rather than
#    the source tree, so we point `app_location` at
#    `dist/jotjson/browser`.
#
#    The API is also prebuilt by CI's `api` job and uploaded as the
#    `api-dist` artifact (host.json, package.json, package-lock.json,
#    and the compiled `dist/`). This job downloads it into `api/`,
#    runs `npm ci` to populate production node_modules on the runner,
#    and passes `skip_api_build: true` to the SWA action. With both
#    `skip_app_build` and `skip_api_build` set, the SWA action is a
#    pure uploader - Oryx never runs in the deploy path. This was
#    introduced to eliminate the Oryx SDK-detect flake (oryx-cdn
#    XPath null-node) that periodically failed CD with no recourse
#    other than re-run.
#
# 2. workflow_dispatch (manual redeploy)
#    The web bundle is BUILT INLINE on the runner host (npm ci + bake +
#    npm run build + copy staticwebapp.config.json), then SWA action
#    gets `skip_app_build: true`. The api is built inline too
#    (npm ci + npm run build under api/) so the prebuilt-tree shape
#    matches the workflow_run path. This duplicates the secret-bake
#    logic from ci.yml's `web` job; the duplication (~25 lines) is
#    intentional v1 tech debt - making workflow_dispatch consume an
#    artifact would require a `ci_run_id` input and complicate the
#    manual-deploy UX.
#
# In both paths, `dist/jotjson/browser/` (containing index.html AND
# staticwebapp.config.json) must exist before the SWA action runs.
# ----------------------------------------------------------------------

# Title each run with the deployed commit's message so the Actions list is
# scannable (matches CI's default behavior). For workflow_run triggers we
# pull the head commit message from the upstream CI run; for manual
# dispatches we fall back to the SHA.
run-name: >-
  ${{ github.event.workflow_run.display_title
      || github.event.head_commit.message
      || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swa-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  # Required for actions/download-artifact to fetch artifacts produced by
  # an upstream workflow_run (cross-workflow artifact access uses the
  # GITHUB_TOKEN's actions:read scope).
  actions: read

jobs:
  deploy:
    name: Build and deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only deploy when CI succeeded for a push to main, or when a human
    # triggers a manual redeploy. PR-triggered CI runs (workflow_run.event
    # == 'pull_request') are explicitly excluded so opening a PR never
    # ships to production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Check for deploy token
        id: check
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN not set - skipping deploy."
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.have_token == 'true'
        with:
          # Deploy the exact commit that passed CI when triggered via
          # workflow_run; fall back to github.sha for workflow_dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: true
          lfs: false
          # Full history so the workflow_dispatch path's inline
          # `npm run build` produces a real `buildNumber`. The
          # workflow_run path doesn't rebuild (it downloads CI's
          # prebuilt bundle) so depth is harmless there.
          fetch-depth: 0

      # ------------------------------------------------------------------
      # Path 1: workflow_run - download prebuilt SPA bundle from CI.
      # ------------------------------------------------------------------
      - name: Download CI web bundle
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Explicit path is required - without it download-artifact
          # extracts to cwd, breaking the SWA action's
          # app_location: 'dist/jotjson/browser'.
          path: dist/jotjson

      - name: Download CI api bundle
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: api-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Lands host.json, package.json, package-lock.json, and the
          # compiled dist/ on top of the api/ source tree from
          # actions/checkout. The subsequent "Install API deps" step
          # populates api/node_modules so the SWA action (with
          # skip_api_build: true) uploads a fully-runnable Functions
          # tree.
          path: api

      - name: Sanity-check downloaded bundle (auto deploy)
        # Defense-in-depth against artifact poisoning. The
        # workflow_run.event == 'push' filter on this job (see the
        # job-level `if:` above) already excludes PR-triggered CI
        # runs, which is the standard documented mitigation for
        # the artifact-poisoning attack class
        # (https://securitylab.github.com/research/github-actions-preventing-pwn-requests/).
        # This step adds explicit content verification so a CI bug
        # or hypothetical malicious push cannot deploy a broken or
        # placeholder-leaking bundle without the deploy step
        # failing first. Mirrors the manual-deploy sanity check
        # below for symmetry between the two deploy paths.
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_run'
        run: |
          if [ ! -f dist/jotjson/browser/index.html ]; then
            echo "::error::dist/jotjson/browser/index.html missing in downloaded artifact"
            exit 1
          fi
          if [ ! -f dist/jotjson/browser/staticwebapp.config.json ]; then
            echo "::error::dist/jotjson/browser/staticwebapp.config.json missing in downloaded artifact"
            exit 1
          fi
          if grep -r --include='*.js' '__ENTRA_' dist/jotjson/browser/; then
            echo "::error::Downloaded bundle contains __ENTRA_ placeholder - upstream secret bake failed"
            exit 1
          fi

      # ------------------------------------------------------------------
      # Path 2: workflow_dispatch - build inline on the runner.
      # The api install below is shared between both paths.
      # ------------------------------------------------------------------
      - uses: actions/setup-node@v6
        if: steps.check.outputs.have_token == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install web deps (manual deploy)
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Materialize environment.ts (manual deploy)
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        run: cp src/environments/environment.example.ts src/environments/environment.ts

      - name: Bake production auth config into environment.prod.ts (manual deploy)
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        env:
          ENTRA_SPA_CLIENT_ID: ${{ secrets.ENTRA_SPA_CLIENT_ID }}
          ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
          ENTRA_KNOWN_AUTHORITY: ${{ secrets.ENTRA_KNOWN_AUTHORITY }}
          ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
          APP_INSIGHTS_CONNECTION_STRING: ${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}
          # MSAL only allows one redirectUri in its config. For prod
          # this workflow stays at https://jotjson.com/ (the canonical
          # custom domain). Sibling workflows (cd-nonprod.yml) override
          # DEPLOY_REDIRECT_URI to point at their own SWA hostname.
          DEPLOY_REDIRECT_URI: 'https://jotjson.com/'
        run: |
          # Duplicates ci.yml's bake step. See "Build topology" comment at
          # the top of this file for why this duplication exists.
          # ci.yml's bake stays hard-coded to https://jotjson.com/ because
          # ci.yml only runs on push-to-main and only ever produces the
          # prod artifact; only this manual path needs to retarget.
          cat > src/environments/environment.prod.ts <<'EOF'
          import { Environment } from './environment.interface';

          export const environment: Environment = {
            production: true,
            apiBaseUrl: '/api',
            auth: {
              clientId: '__ENTRA_SPA_CLIENT_ID__',
              authority: '__ENTRA_AUTHORITY__',
              knownAuthorities: ['__ENTRA_KNOWN_AUTHORITY__'],
              redirectUri: '__DEPLOY_REDIRECT_URI__',
              postLogoutRedirectUri: '__DEPLOY_REDIRECT_URI__',
              scopes: ['__ENTRA_API_SCOPE__']
            },
            appInsightsConnectionString: '__APP_INSIGHTS_CONNECTION_STRING__'
          };
          EOF
          sed -i 's/^          //' src/environments/environment.prod.ts
          sed -i "s|__ENTRA_SPA_CLIENT_ID__|${ENTRA_SPA_CLIENT_ID}|g" src/environments/environment.prod.ts
          sed -i "s|__ENTRA_AUTHORITY__|${ENTRA_AUTHORITY}|g" src/environments/environment.prod.ts
          sed -i "s|__ENTRA_KNOWN_AUTHORITY__|${ENTRA_KNOWN_AUTHORITY}|g" src/environments/environment.prod.ts
          sed -i "s|__ENTRA_API_SCOPE__|${ENTRA_API_SCOPE}|g" src/environments/environment.prod.ts
          sed -i "s|__APP_INSIGHTS_CONNECTION_STRING__|${APP_INSIGHTS_CONNECTION_STRING}|g" src/environments/environment.prod.ts
          sed -i "s|__DEPLOY_REDIRECT_URI__|${DEPLOY_REDIRECT_URI}|g" src/environments/environment.prod.ts
          if grep -q "__ENTRA_\|__DEPLOY_REDIRECT_URI__" src/environments/environment.prod.ts; then
            echo "::error::One or more required deploy values are missing (ENTRA_* / DEPLOY_REDIRECT_URI) - aborting deploy."
            exit 1
          fi

      - name: Build SPA (manual deploy)
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        run: npm run build -- --configuration=production

      - name: Copy SWA config into bundle (manual deploy)
        # See ci.yml for rationale; mirrors the same step there.
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        run: cp staticwebapp.config.json dist/jotjson/browser/staticwebapp.config.json

      - name: Sanity-check production bundle (manual deploy)
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f dist/jotjson/browser/index.html ]; then
            echo "::error::dist/jotjson/browser/index.html missing"
            exit 1
          fi
          if [ ! -f dist/jotjson/browser/staticwebapp.config.json ]; then
            echo "::error::dist/jotjson/browser/staticwebapp.config.json missing"
            exit 1
          fi
          if grep -r --include='*.js' '__ENTRA_' dist/jotjson/browser/; then
            echo "::error::Production bundle contains __ENTRA_ placeholder - secret bake failed"
            exit 1
          fi

      # ------------------------------------------------------------------
      # Sourcemap upload to Azure Blob Storage (manual deploy path).
      # Mirrors ci.yml's sourcemap-upload steps so workflow_dispatch
      # emergency deploys keep the AI-connected Storage container in
      # sync with deployed JS. Without this, a manual redeploy would
      # leave the portal symbolicating against stale maps. See
      # DESIGN_SPEC.md "Sourcemaps" section.
      # ------------------------------------------------------------------
      - name: Azure login (sourcemap upload, manual deploy)
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload sourcemaps to Azure Blob Storage (manual deploy)
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        env:
          STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: |
          az storage blob upload-batch \
            --source dist/jotjson/browser \
            --destination sourcemaps \
            --account-name "$STORAGE_ACCOUNT" \
            --pattern '*.map' \
            --auth-mode login \
            --overwrite true
      - name: Azure logout (sourcemap upload, manual deploy)
        if: ${{ always() && steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch' }}
        run: az logout --username "${{ secrets.AZURE_CLIENT_ID }}" || true

      # ------------------------------------------------------------------
      # Shared: install api deps on the runner so the SWA upload (with
      # skip_api_build: true) sees a fully-runnable Functions tree at
      # api_location. The TS->JS compile is done in CI's `api` job
      # (workflow_run path -> downloaded as api-dist) or by the
      # "Build API (manual deploy)" step below (workflow_dispatch
      # path); Oryx is no longer in the deploy pipeline.
      #
      # The two trigger paths install differently on purpose:
      #
      # - workflow_run (auto on push-to-main): the api-dist artifact
      #   carries the compiled dist/, so no tsc runs on the runner.
      #   We install with `--omit=dev` to skip ~54 MB of typescript /
      #   jest / @types/* that the Functions runtime never reads.
      #
      # - workflow_dispatch (manual redeploy): no artifact; the runner
      #   compiles via `npm run build`, which needs typescript (a
      #   devDep). We do a full `npm ci` and DELIBERATELY do not prune
      #   devDeps after build. The manual path is the fast-rollback
      #   hatch - keeping it maximally-permissive means a `gh workflow
      #   run cd.yml` can recover from any failure mode the slim path
      #   introduces. The ~80 MB cost on a rare manual deploy buys a
      #   working recovery option.
      #
      # Use a positive `event_name == 'workflow_run'` match (not a
      # negation): future trigger additions fail safely instead of
      # silently falling into the slim-install branch.
      # ------------------------------------------------------------------
      - name: Install API production deps (workflow_run)
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_run'
        working-directory: api
        run: npm ci --omit=dev

      - name: Install API full deps (workflow_dispatch)
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: api
        run: npm ci

      - name: Build API (manual deploy)
        # workflow_run path downloads compiled dist/ from the api-dist
        # artifact; workflow_dispatch path has only source TS at this
        # point and needs an explicit compile so the SWA upload (with
        # skip_api_build: true) sees the JS files referenced by
        # api/package.json's `main` glob.
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: api
        run: npm run build

      - name: Verify devDeps were omitted (workflow_run)
        # Guard against silent regressions: if a future npm release
        # changes `--omit=dev` semantics, or someone moves a devDep
        # into `dependencies`, this step fails the deploy with a clear
        # message instead of letting the artifact balloon back
        # unnoticed.
        #
        # `npm ls <pkg> --all --parseable` walks the full installed
        # tree (including nested `node_modules/<dep>/node_modules/`
        # entries that npm may emit when resolving version conflicts),
        # so a top-level `[ -d node_modules/$d ]` check would miss
        # those. The parseable output is empty when the package is
        # absent.
        #
        # The check list is intentionally limited to the highest-
        # impact pure devDeps from `api/package.json`. `@types/node`
        # and `@types/jsonwebtoken` are deliberately excluded: they
        # survive `--omit=dev` as transitive deps of
        # `applicationinsights` and `jwks-rsa` respectively (verified
        # via `npm ls @types/node`), are inert .d.ts files at runtime,
        # and not worth blocking the deploy on.
        if: steps.check.outputs.have_token == 'true' && github.event_name == 'workflow_run'
        working-directory: api
        run: |
          fail=0
          for d in typescript jest ts-jest jest-junit "@types/jest"; do
            if [ -n "$(npm ls "$d" --all --parseable 2>/dev/null)" ]; then
              echo "::error::Expected $d to be absent from node_modules after --omit=dev, but npm reports it installed."
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "OK: known devDeps absent from node_modules/."

      - name: Deploy to Azure Static Web Apps
        id: deploy_swa
        if: steps.check.outputs.have_token == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # With skip_app_build: true the SWA action treats app_location
          # as the prebuilt SPA output directory (per Microsoft docs).
          # With skip_api_build: true it likewise treats api_location as
          # a prebuilt Functions tree and uploads it as-is - no Oryx.
          # output_location is therefore unused.
          app_location: 'dist/jotjson/browser'
          api_location: 'api'
          skip_app_build: true
          skip_api_build: true

      - name: Check deploy freshness
        if: ${{ success() && steps.deploy_swa.outcome == 'success' }}
        timeout-minutes: 10
        # NOTE: Do not re-add --expected-sha=${{ github.sha }} -- in
        # workflow_run context `github.sha` resolves to the
        # default-branch HEAD at trigger time, NOT the built SHA
        # (which is `workflow_run.head_sha`, used at line 105 above).
        # The current freshness check verifies edge propagation via
        # byte-match against the locally-built `dist/jotjson/browser/sw.js`.
        # That match is structural, not SHA-tied: `src/sw.worker.ts`
        # has no per-commit values, so the SW bytes are deterministic
        # across commits that don't touch SW source. Restoring true
        # SHA-tied verification needs a build-time SHA marker that the
        # script can probe (e.g., a generated `/build-info.json`).
        # Tracked as a follow-up issue (see PR description).
        run: npm run check:deploy-freshness -- --origin=https://jotjson.com

