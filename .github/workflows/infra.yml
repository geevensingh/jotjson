name: Infra (Bicep)

# ----------------------------------------------------------------------
# Trigger -> behavior (READ BEFORE EDITING):
#
# All triggers fire the workflow. A `changes` job runs first and
# detects whether any path under `infra/**` or
# `.github/workflows/infra.yml` was modified. Other jobs gate on the
# changes output and skip when no infra paths changed. Skipped jobs
# report as success to GitHub branch protection, so the check name
# "Bicep what-if" always reports a result -- ready for a future
# required-status flip without blocking PRs that don't touch infra.
#
# 1. push to main (any path)
#    -> changes runs. If infra changed: build + what-if + auto-deploy
#       (deploy gated on build/what-if success; the `az ... what-if`
#       call must complete -- it's a preview, not a content-aware
#       gate). If not: all other jobs skip.
#
# 2. workflow_dispatch
#    -> escape hatch: paths-filter treats workflow_dispatch as "all
#       paths changed", so build + what-if + deploy all run regardless
#       of actual diff. Manual override for redeploys (rolling forward
#       to a specific SHA, post-manual-Azure changes).
#
# 3. pull_request to main (any path)
#    -> changes runs. If infra changed: build + what-if run, with
#       what-if output visible in the PR's checks tab. The "ensure
#       resource group exists" step is skipped on PRs to keep
#       what-if read-only (the step is idempotent but still hits
#       ARM and writes an activity-log entry). If not: all other
#       jobs skip. Fork PRs skip what-if (deploy never runs from
#       a PR regardless) -- GitHub doesn't pass secrets to fork-PR
#       runs, so without the guard the run would fail noisily on
#       azure/login. The check is OPTIONAL today; the changes-job
#       restructure prepares it for a future required-status flip.
#
# Run titles per trigger:
#   push to main          <commit subject>            (GitHub default;
#                                                      push to main with
#                                                      infra changes
#                                                      implies a deploy
#                                                      via the deploy
#                                                      job's if-gate)
#   workflow_dispatch     [deploy/manual]
#   pull_request          [infra] <PR title>
#   any other event       <event-specific default>    (GitHub default)
#
# We fall back to GitHub's default for push because GitHub Actions
# expressions have no string-split/substring/replace and therefore can't
# extract just the commit subject from a multi-line message; an empty
# (whitespace) run-name causes GitHub to use its built-in default, which
# auto-extracts the subject. PR runs use pull_request.title (already
# single-line). workflow_dispatch has no inherent context to surface, so
# we just emit the tag.
# ----------------------------------------------------------------------

run-name: >-
  ${{ (github.event_name == 'pull_request'
        && format('[infra] {0}', github.event.pull_request.title))
      || (github.event_name == 'workflow_dispatch' && '[deploy/manual]')
      || '' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Workflow-level permissions are the minimum every job needs:
#   - contents: read   -- actions/checkout@v6 (every job)
#
# Per-job escalations live in each job's `permissions:` block:
#   - validate -> id-token: write (azure/login@v3 for what-if)
#   - deploy   -> id-token: write (azure/login@v3 for deployment)
#
# `changes` and `build` (no Azure calls) intentionally have no
# id-token: write. Reduces blast radius if a third-party action used
# during change detection or build is compromised.
permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # dorny/paths-filter@v4 uses the GitHub REST API to list changed
    # files on pull_request events, which requires `pull-requests: read`
    # per its README. Base-repo PRs work with `contents: read` alone via
    # the default token's implicit allowances, but fork PRs or future
    # token-default tightening would break. Job-scoped (not
    # workflow-level) per least privilege; other jobs don't need PR
    # read access.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v6
        with:
          # dorny/paths-filter@v4 uses git commands (not the API) on
          # `push` events where the pushed branch equals `base`, which
          # is our `push: main` case. It diffs against "the most recent
          # commit on the same branch before the push" -- needing local
          # history beyond the default shallow fetch-depth of 1.
          # `fetch-depth: 0` fetches full history. (For pull_request
          # events the API is used and this setting is moot but
          # harmless.)
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # paths-filter treats triggers other than pull_request /
          # pull_request_target / push / merge_group as "all paths
          # changed", so workflow_dispatch reports infra=true and the
          # downstream gates fall through to "run everything". That's
          # the escape hatch that keeps manual redeploys functional.
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/infra.yml'

  build:
    name: Bicep build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Build main.bicep
        run: az bicep build --file infra/main.bicep
      - name: Validate dev.bicepparam
        # Only main.bicep + bicepparams reachable from main are validated
        # here. Stray .bicep files outside /infra and unreachable modules
        # under /infra are NOT validated by this workflow. Convention:
        # all IaC lives under /infra and is reachable from main.bicep.
        run: az bicep build-params --file infra/parameters/dev.bicepparam

  validate:
    name: Bicep what-if
    runs-on: ubuntu-latest
    needs: [changes, build]
    # Run when infra changed (push/PR/dispatch) AND, for PRs, only when
    # the PR is from the base repo. Fork PRs would otherwise fail at
    # azure/login because GitHub doesn't pass secrets to fork-PR runs.
    if: |
      needs.changes.outputs.infra == 'true'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group exists
        # Skip on PRs to keep what-if read-only. `az group create` is
        # idempotent but still hits ARM and writes an Update entry in
        # the RG's activity log. The cold-start path runs through
        # workflow_dispatch or push to main (both still execute this
        # step); in steady state the RG already exists and what-if
        # succeeds on PRs without it.
        if: github.event_name != 'pull_request'
        run: |
          az group create \
            --name rg-jotjson-dev \
            --location ${{ vars.AZURE_LOCATION || 'eastus2' }}
      - name: What-if
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
          ENTRA_SPA_CLIENT_ID: ${{ secrets.ENTRA_SPA_CLIENT_ID }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
          ENTRA_API_AUDIENCE: ${{ secrets.ENTRA_API_AUDIENCE }}
        run: |
          az deployment group what-if \
            --resource-group rg-jotjson-dev \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              entraTenantId="${ENTRA_TENANT_ID}" \
              entraAuthority="${ENTRA_AUTHORITY}" \
              entraSpaClientId="${ENTRA_SPA_CLIENT_ID}" \
              entraApiClientId="${ENTRA_API_CLIENT_ID}" \
              entraApiAudience="${ENTRA_API_AUDIENCE}"

  deploy:
    name: Deploy
    needs: [changes, build, validate]
    # workflow_dispatch is the manual escape hatch (always deploy).
    # Otherwise: only deploy on push to main when infra actually changed
    # (push that touches no infra paths runs the changes job alone and
    # skips deploy). PRs never deploy.
    if: |
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.changes.outputs.infra == 'true')
    concurrency:
      group: infra-deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group exists
        run: |
          az group create \
            --name rg-jotjson-dev \
            --location ${{ vars.AZURE_LOCATION || 'eastus2' }}
      - name: Deploy Bicep
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
          ENTRA_SPA_CLIENT_ID: ${{ secrets.ENTRA_SPA_CLIENT_ID }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
          ENTRA_API_AUDIENCE: ${{ secrets.ENTRA_API_AUDIENCE }}
        run: |
          az deployment group create \
            --resource-group rg-jotjson-dev \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              entraTenantId="${ENTRA_TENANT_ID}" \
              entraAuthority="${ENTRA_AUTHORITY}" \
              entraSpaClientId="${ENTRA_SPA_CLIENT_ID}" \
              entraApiClientId="${ENTRA_API_CLIENT_ID}" \
              entraApiAudience="${ENTRA_API_AUDIENCE}"
      - name: Summary
        if: ${{ always() && !cancelled() }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            {
              echo "## Deployed"
              echo ""
              echo "- Resource group: rg-jotjson-dev"
              echo "- Commit: ${{ github.sha }}"
              echo "- Trigger: ${{ github.event_name }}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Deploy failed"
              echo ""
              echo "- Resource group: rg-jotjson-dev"
              echo "- Commit: ${{ github.sha }}"
              echo "- Trigger: ${{ github.event_name }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

