name: Infra (Bicep)

# ----------------------------------------------------------------------
# Trigger -> behavior (READ BEFORE EDITING):
#
# 1. push to main (paths: infra/**, this file)
#    -> build + what-if + auto-deploy. Deploy is gated on
#       build/what-if success (the `az ... what-if` call must
#       complete; it's a preview, not a content-aware gate).
#       PR-time diff review is the meaningful safety check.
#
# 2. workflow_dispatch
#    -> same path as push; manual override for redeploys (e.g.,
#       rolling forward to a specific SHA, post-manual-Azure
#       changes).
#
# 3. pull_request to main
#    -> build only. validate (what-if) is skipped on PRs;
#       expanding it to PRs is a separate decision (requires
#       Azure secrets / OIDC policy for PR runs).
#
# Run titles per trigger:
#   push to main          <commit subject>            (GitHub default;
#                                                      push always = deploy
#                                                      via the deploy job's
#                                                      if-gate, so the
#                                                      absence of an explicit
#                                                      tag implicitly means
#                                                      a deploy)
#   workflow_dispatch     [deploy/manual]
#   pull_request          [build-only] <PR title>
#   any other event       <event-specific default>    (GitHub default)
#
# We fall back to GitHub's default for push because GitHub Actions
# expressions have no string-split/substring/replace and therefore can't
# extract just the commit subject from a multi-line message; an empty
# (whitespace) run-name causes GitHub to use its built-in default, which
# auto-extracts the subject. PR runs use pull_request.title (already
# single-line). workflow_dispatch has no inherent context to surface, so
# we just emit the tag.
# ----------------------------------------------------------------------

run-name: >-
  ${{ (github.event_name == 'pull_request'
        && format('[build-only] {0}', github.event.pull_request.title))
      || (github.event_name == 'workflow_dispatch' && '[deploy/manual]')
      || '' }}

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch: {}

# Workflow-level permissions are the minimum every job needs:
#   - contents: read   -- actions/checkout@v6 (every job)
#
# Per-job escalations live in each job's `permissions:` block:
#   - validate -> id-token: write (azure/login@v3 for what-if)
#   - deploy   -> id-token: write (azure/login@v3 for deployment)
#
# `build` (Bicep build only, no Azure call) intentionally has no
# id-token: write. Reduces blast radius if a third-party action used
# during build is compromised.
permissions:
  contents: read

jobs:
  build:
    name: Bicep build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Build main.bicep
        run: az bicep build --file infra/main.bicep
      - name: Validate dev.bicepparam
        # Only main.bicep + bicepparams reachable from main are validated
        # here. Stray .bicep files outside /infra and unreachable modules
        # under /infra are NOT validated by this workflow. Convention:
        # all IaC lives under /infra and is reachable from main.bicep.
        run: az bicep build-params --file infra/parameters/dev.bicepparam

  validate:
    name: Bicep what-if
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group exists
        run: |
          az group create \
            --name rg-jotjson-dev \
            --location ${{ vars.AZURE_LOCATION || 'eastus2' }}
      - name: What-if
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
          ENTRA_SPA_CLIENT_ID: ${{ secrets.ENTRA_SPA_CLIENT_ID }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
          ENTRA_API_AUDIENCE: ${{ secrets.ENTRA_API_AUDIENCE }}
        run: |
          az deployment group what-if \
            --resource-group rg-jotjson-dev \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              entraTenantId="${ENTRA_TENANT_ID}" \
              entraAuthority="${ENTRA_AUTHORITY}" \
              entraSpaClientId="${ENTRA_SPA_CLIENT_ID}" \
              entraApiClientId="${ENTRA_API_CLIENT_ID}" \
              entraApiAudience="${ENTRA_API_AUDIENCE}"

  deploy:
    name: Deploy
    needs: [build, validate]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    concurrency:
      group: infra-deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group exists
        run: |
          az group create \
            --name rg-jotjson-dev \
            --location ${{ vars.AZURE_LOCATION || 'eastus2' }}
      - name: Deploy Bicep
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
          ENTRA_SPA_CLIENT_ID: ${{ secrets.ENTRA_SPA_CLIENT_ID }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
          ENTRA_API_AUDIENCE: ${{ secrets.ENTRA_API_AUDIENCE }}
        run: |
          az deployment group create \
            --resource-group rg-jotjson-dev \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              entraTenantId="${ENTRA_TENANT_ID}" \
              entraAuthority="${ENTRA_AUTHORITY}" \
              entraSpaClientId="${ENTRA_SPA_CLIENT_ID}" \
              entraApiClientId="${ENTRA_API_CLIENT_ID}" \
              entraApiAudience="${ENTRA_API_AUDIENCE}"
      - name: Summary
        if: ${{ always() && !cancelled() }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            {
              echo "## Deployed"
              echo ""
              echo "- Resource group: rg-jotjson-dev"
              echo "- Commit: ${{ github.sha }}"
              echo "- Trigger: ${{ github.event_name }}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Deploy failed"
              echo ""
              echo "- Resource group: rg-jotjson-dev"
              echo "- Commit: ${{ github.sha }}"
              echo "- Trigger: ${{ github.event_name }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

