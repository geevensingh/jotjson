# Dependabot configuration for JotJSON.
# Covers ecosystems actually used in this repo:
#   - npm: /           (Angular SPA)
#   - npm: /api        (Azure Functions)
#   - github-actions   (CI/CD workflows)
# Bicep (/infra) has no Dependabot ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - web
    commit-message:
      prefix: deps(web)
      include: scope
    # @types/node tracks the Node major we develop and test against. Local
    # dev, CI, and Functions Core Tools all use Node 24 (.nvmrc,
    # engines.node, setup-node steps). The deployed Static Web Apps
    # managed-Functions runtime is capped at node:22 by the platform
    # (see staticwebapp.config.json -> platform.apiRuntime), but Node 22's
    # stdlib is a strict subset of Node 24's for what we consume, so
    # compiling against the newer @types/node is intentional. Block major
    # bumps for @types/node so we don't jump ahead of our local Node 24.
    # Revisit when we move to the next LTS (or SWA raises the ceiling).
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Angular runtime + dev tooling are peer-locked: @angular/compiler-cli
      # and friends must match @angular/* exactly. Bundle every @angular/* and
      # @angular-devkit/* package (regardless of dependency-type) into one PR
      # so a single Angular release lands as a single mergeable change.
      # Material/CDK are released on a separate cadence and stay carved out.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
        exclude-patterns:
          - '@angular/material'
          - '@angular/cdk'
      material:
        patterns:
          - '@angular/material'
          - '@angular/cdk'
      # The Vitest toolchain is peer-locked at an EXACT version, in both
      # directions: @vitest/browser-playwright peers vitest exactly and
      # depends on @vitest/browser exactly; @vitest/coverage-v8 peers vitest
      # exactly (and @vitest/browser exactly, though that peer is optional);
      # and vitest itself peers back on @vitest/browser-playwright and
      # @vitest/coverage-v8 at exact versions. A partial bump cannot resolve.
      #
      # Why this group exists (issue #533): these packages previously sat in
      # dev-minor. PR #491 lifted @vitest/browser-playwright and
      # @vitest/coverage-v8 4.1.7 -> 4.1.10 as incidental riders there; when
      # that group PR was superseded by the regenerated #523, the @vitest/*
      # bumps were dropped entirely while co-tenants survived. Two critical
      # @vitest/browser advisories stayed open with no signal that their
      # remediation had vanished. Isolating the family means a dropped bump is
      # a visibly absent PR rather than three quietly missing lines inside a
      # large one.
      #
      # Scope limits, stated so the next reader does not over-trust this:
      #   - VERSION UPDATES ONLY. Dependabot groups default to
      #     `applies-to: version-updates`, and one group cannot serve both
      #     paths. That is the correct scope here: the security updater cannot
      #     remediate @vitest/browser at all, because it is transitive and its
      #     parent pins it exactly -- which is why #533 reports no PR. A
      #     sibling `applies-to: security-updates` group would be inert.
      #   - 4.x LOCKSTEP ONLY. @analogjs/vitest-angular peers vitest at
      #     ^4.0.0 and is NOT in this group: it also peers
      #     @angular-devkit/architect, so it straddles the vitest and angular
      #     families and no grouping assigns it correctly. A vitest MAJOR will
      #     therefore additionally require a coordinated
      #     @analogjs/vitest-angular bump that Dependabot will not bundle.
      #
      # update-types is deliberately omitted (matching the angular group): the
      # exact peer pins break identically at patch, minor, and major, so
      # restricting by update-type would reopen the hole where it hurts most.
      #
      # See docs/supply-chain.md -> "Peer-locked dependency families".
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      # dev-minor catches everything else dev-typed; keep @angular and
      # @vitest packages out so they always route to the groups above.
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'vitest'
          - '@vitest/*'

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - api
    commit-message:
      prefix: deps(api)
      include: scope
    # @types/node tracks the Node major we develop and test against. Local
    # dev, CI, and Functions Core Tools all use Node 24 (.nvmrc,
    # engines.node, setup-node steps). The deployed Static Web Apps
    # managed-Functions runtime is capped at node:22 by the platform
    # (see staticwebapp.config.json -> platform.apiRuntime), but Node 22's
    # stdlib is a strict subset of Node 24's for what we consume, so
    # compiling against the newer @types/node is intentional. Block major
    # bumps for @types/node so we don't jump ahead of our local Node 24.
    # Revisit when we move to the next LTS (or SWA raises the ceiling).
    #
    # jwks-rsa v4 upgrades to jose v6, which is ESM-only (no CJS dist).
    # Jest's vm.Script-based runtime cannot parse `export` syntax, so any
    # test suite that transitively imports api/src/shared/auth.ts fails to
    # parse. Block major bumps until either Jest stabilizes require(esm)
    # without --experimental-vm-modules, or jose republishes a CJS build.
    # See api/src/shared/auth.ts for the parking-rationale comment.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jwks-rsa'
        update-types: ['version-update:semver-major']
    groups:
      azure-sdk:
        patterns:
          - '@azure/*'
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: deps(ci)
      include: scope
