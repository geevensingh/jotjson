# Dependabot configuration for JotJSON.
# Covers ecosystems actually used in this repo:
#   - npm: /           (Angular SPA)
#   - npm: /api        (Azure Functions)
#   - github-actions   (CI/CD workflows)
# Bicep (/infra) has no Dependabot ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - web
    commit-message:
      prefix: deps(web)
      include: scope
    # @types/node tracks the Node major we develop and test against. Local
    # dev, CI, and Functions Core Tools all use Node 24 (.nvmrc,
    # engines.node, setup-node steps). The deployed Static Web Apps
    # managed-Functions runtime is capped at node:22 by the platform
    # (see staticwebapp.config.json -> platform.apiRuntime), but Node 22's
    # stdlib is a strict subset of Node 24's for what we consume, so
    # compiling against the newer @types/node is intentional. Block major
    # bumps for @types/node so we don't jump ahead of our local Node 24.
    # Revisit when we move to the next LTS (or SWA raises the ceiling).
    #
    # Karma + Jasmine surface is frozen on the perf-suite-only Karma
    # config (karma.perf.conf.js) per the issue #47 partial-cutover
    # decision. We can't fully test major bumps for these packages in CI
    # without running the perf bench (which is local-only), so block
    # majors until the perf-suite is migrated off Karma. See issue #417.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'karma'
        update-types: ['version-update:semver-major']
      - dependency-name: 'karma-chrome-launcher'
        update-types: ['version-update:semver-major']
      - dependency-name: 'karma-jasmine'
        update-types: ['version-update:semver-major']
      - dependency-name: 'karma-jasmine-html-reporter'
        update-types: ['version-update:semver-major']
      - dependency-name: 'karma-spec-reporter'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jasmine-core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jasmine'
        update-types: ['version-update:semver-major']
    groups:
      # Angular runtime + dev tooling are peer-locked: @angular/compiler-cli
      # and friends must match @angular/* exactly. Bundle every @angular/* and
      # @angular-devkit/* package (regardless of dependency-type) into one PR
      # so a single Angular release lands as a single mergeable change.
      # Material/CDK are released on a separate cadence and stay carved out.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
        exclude-patterns:
          - '@angular/material'
          - '@angular/cdk'
      material:
        patterns:
          - '@angular/material'
          - '@angular/cdk'
      # dev-minor catches everything else dev-typed; keep @angular packages
      # out so they always route to the angular group above.
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - api
    commit-message:
      prefix: deps(api)
      include: scope
    # @types/node tracks the Node major we develop and test against. Local
    # dev, CI, and Functions Core Tools all use Node 24 (.nvmrc,
    # engines.node, setup-node steps). The deployed Static Web Apps
    # managed-Functions runtime is capped at node:22 by the platform
    # (see staticwebapp.config.json -> platform.apiRuntime), but Node 22's
    # stdlib is a strict subset of Node 24's for what we consume, so
    # compiling against the newer @types/node is intentional. Block major
    # bumps for @types/node so we don't jump ahead of our local Node 24.
    # Revisit when we move to the next LTS (or SWA raises the ceiling).
    #
    # jwks-rsa v4 upgrades to jose v6, which is ESM-only (no CJS dist).
    # Jest's vm.Script-based runtime cannot parse `export` syntax, so any
    # test suite that transitively imports api/src/shared/auth.ts fails to
    # parse. Block major bumps until either Jest stabilizes require(esm)
    # without --experimental-vm-modules, or jose republishes a CJS build.
    # See api/src/shared/auth.ts for the parking-rationale comment.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jwks-rsa'
        update-types: ['version-update:semver-major']
    groups:
      azure-sdk:
        patterns:
          - '@azure/*'
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: deps(ci)
      include: scope
