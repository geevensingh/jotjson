# Dependabot configuration for JotJSON.
# Covers ecosystems actually used in this repo:
#   - npm: /           (Angular SPA)
#   - npm: /api        (Azure Functions)
#   - github-actions   (CI/CD workflows)
# Bicep (/infra) has no Dependabot ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - web
    commit-message:
      prefix: deps(web)
      include: scope
    # @types/node tracks the Node runtime major. We are pinned to Node 24
    # (.nvmrc, engines.node, setup-node steps in CI/CD), so block major
    # bumps for @types/node. Revisit when we move to the next LTS.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Angular runtime + dev tooling are peer-locked: @angular/compiler-cli
      # and friends must match @angular/* exactly. Bundle every @angular/* and
      # @angular-devkit/* package (regardless of dependency-type) into one PR
      # so a single Angular release lands as a single mergeable change.
      # Material/CDK are released on a separate cadence and stay carved out.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
        exclude-patterns:
          - '@angular/material'
          - '@angular/cdk'
      material:
        patterns:
          - '@angular/material'
          - '@angular/cdk'
      # dev-minor catches everything else dev-typed; keep @angular packages
      # out so they always route to the angular group above.
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - api
    commit-message:
      prefix: deps(api)
      include: scope
    # @types/node tracks the Node runtime major. We are pinned to Node 24
    # (.nvmrc, engines.node, setup-node steps in CI/CD), so block major
    # bumps for @types/node. Revisit when we move to the next LTS.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      azure-sdk:
        patterns:
          - '@azure/*'
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: deps(ci)
      include: scope
